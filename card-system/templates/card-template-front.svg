<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1050" width="1480" height="1050">
  <title>ChemBioMed Cards – OC-012 Vorderseite</title>
  <defs>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#00000022"/>
    </filter>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="1480" height="1050" rx="12"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="1480" height="1050" fill="#ffffff" rx="12"
        filter="url(#card-shadow)" clip-path="url(#card-clip)"/>
  <rect x="0" y="0" width="1480" height="1050" fill="none" stroke="#e0e0e0"
        stroke-width="2" rx="12"/>

  <!-- === Register Tabs (left side, stacked, inward-facing) === -->
  <!-- AC tab (inactive) -->
  <rect x="0" y="28" width="160" height="110" rx="0" fill="#e8f0fe"/>
  <rect x="0" y="28" width="160" height="110" rx="0" fill="#e8f0fe"
        clip-path="url(#tab-ac-clip)"/>
  <clipPath id="tab-ac-clip">
    <rect x="0" y="28" width="160" height="110" rx="14"/>
  </clipPath>
  <rect x="0" y="28" width="160" height="110" fill="#e8f0fe" rx="0"/>
  <rect x="80" y="28" width="80" height="110" fill="#e8f0fe"/>
  <rect x="0" y="28" width="160" height="110" rx="14" fill="#e8f0fe"/>
  <rect x="0" y="28" width="80" height="110" fill="#e8f0fe"/>
  <text x="80" y="93" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#1E88E5" letter-spacing="1">AC</text>

  <!-- OC tab (ACTIVE) -->
  <rect x="0" y="143" width="160" height="110" fill="#FB8C00" rx="14"/>
  <rect x="0" y="143" width="80" height="110" fill="#FB8C00"/>
  <text x="80" y="208" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">OC</text>

  <!-- BC tab (inactive) -->
  <rect x="0" y="258" width="160" height="110" fill="#e8f5e9" rx="14"/>
  <rect x="0" y="258" width="80" height="110" fill="#e8f5e9"/>
  <text x="80" y="323" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#43A047" letter-spacing="1">BC</text>

  <!-- MB tab (inactive) -->
  <rect x="0" y="373" width="160" height="110" fill="#f3e5f5" rx="14"/>
  <rect x="0" y="373" width="80" height="110" fill="#f3e5f5"/>
  <text x="80" y="438" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#8E24AA" letter-spacing="1">MB</text>

  <!-- APC tab (inactive) -->
  <rect x="0" y="488" width="160" height="110" fill="#e0f2f1" rx="14"/>
  <rect x="0" y="488" width="80" height="110" fill="#e0f2f1"/>
  <text x="80" y="553" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="25" font-weight="700" fill="#00897B" letter-spacing="1">APC</text>

  <!-- PH tab (inactive) -->
  <rect x="0" y="603" width="160" height="110" fill="#ffebee" rx="14"/>
  <rect x="0" y="603" width="80" height="110" fill="#ffebee"/>
  <text x="80" y="668" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#E53935" letter-spacing="1">PH</text>

  <!-- === Logo top right === -->
  <text x="1460" y="50" text-anchor="end"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="700" fill="#9e9e9e" letter-spacing="1">CHEMBIOMED CARDS</text>

  <!-- === Main content area === -->
  <!-- Card title -->
  <text x="810" y="350" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="96" font-weight="800" fill="#212121">Primärer Alkohol</text>

  <!-- Subtitle -->
  <text x="810" y="410" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="32" font-weight="500" fill="#757575" letter-spacing="2">OC · Alkohole · Grundlagen</text>

  <!-- Diagram placeholder (dashed rectangle) -->
  <rect x="430" y="450" width="760" height="380" rx="10"
        fill="none" stroke="#bdbdbd" stroke-width="3" stroke-dasharray="14,8"/>
  <text x="810" y="645" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="28" fill="#bdbdbd">Strukturformel-Platzhalter</text>
  <text x="810" y="688" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="22" fill="#d0d0d0">[ Strukturdiagramm hier einfügen ]</text>

  <!-- === Footer === -->
  <!-- Card ID bottom left -->
  <text x="185" y="1025" text-anchor="start"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#9e9e9e">OC-012</text>

  <!-- QR placeholder bottom right -->
  <rect x="1240" y="862" width="180" height="180" rx="8" fill="#e0e0e0"/>
  <text x="1330" y="957" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="700" fill="#9e9e9e">QR</text>

  <!-- Copyright bottom right -->
  <text x="1230" y="1020" text-anchor="end"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="18" fill="#bdbdbd">&#169; Copyright 2026 | Andreas Tremml | Alle Rechte vorbehalten</text>
</svg>
