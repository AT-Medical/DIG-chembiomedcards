name: Content Review
description: Fachliche Prüfung oder Korrektur von Karteninhalten
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Bitte beschreibe die gewünschte fachliche Prüfung oder Korrektur der Karteninhalte.
      placeholder: Beschreibe den Inhalt, die betroffene Karte und die gewünschte Änderung.
    validations:
      required: true
